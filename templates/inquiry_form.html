{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2>Log New Inquiry</h2>
    <p style="color: #666; margin-bottom: 20px;">Capture raw inbound requests.</p>

    {% if error %}
    <div style="background: #ffebee; color: #c62828; padding: 15px; border-radius: 6px; border: 1px solid #ef9a9a; margin-bottom: 20px; font-weight: bold;">
        ⚠️ {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('inquiry') }}">
        <h3 style="border-bottom: 2px solid #4caf50; padding-bottom: 5px; color: #2e7d32;">Contact Details</h3>
        <label>Organization Name</label>
        <input type="text" name="organization" required>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;"><label>Contact Name</label><input type="text" name="contact" required></div>
            <div style="flex: 1;"><label>Role / Title</label><input type="text" name="role"></div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;"><label>Email</label><input type="email" name="email" required></div>
            <div style="flex: 1;"><label>Phone</label><input type="text" name="phone"></div>
        </div>

        <label>Organization Country</label>
        <select name="country" id="countrySelect1" required>
            {% include 'countries.html' %}
        </select>

        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 20px;">Classification</h3>
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Source</label>
                <select name="source" required>
                    <option value="" disabled selected>-- Select Source --</option>
                    {% for item in dropdowns.sources %}<option value="{{ item }}">{{ item }}</option>{% endfor %}
                </select>
            </div>
            <div style="flex: 1;">
                <label>Lead Category</label>
                <select name="category" required>
                    <option value="" disabled selected>-- Select Category --</option>
                    {% for item in dropdowns.lead_categories %}<option value="{{ item }}">{{ item }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <label>Target Geography (Market Interest)</label>
        <select name="geography" id="countrySelect2" required>
            {% include 'countries.html' %}
        </select>

        <label>Nature of Inquiry</label>
        <select name="nature" id="inquiryNature" required>
            <option value="" disabled selected>-- Select Nature --</option>
            {% for item in dropdowns.nature_of_inquiries %}<option value="{{ item }}">{{ item }}</option>{% endfor %}
        </select>
        
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Sector</label>
                <select name="sector" required>
                    <option value="" disabled selected>-- Select Sector --</option>
                    {% for item in dropdowns.sectors %}<option value="{{ item }}">{{ item }}</option>{% endfor %}
                </select>
            </div>
            <div style="flex: 1; display: none;" id="commodityWrapper">
                <label>Commodity</label>
                <input type="text" name="commodity" placeholder="e.g. Cocoa, Cashew">
            </div>
        </div>

        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 20px;">Assessment</h3>
        <label>Estimated Value (USD)</label>
        <input type="number" name="value" placeholder="0.00" step="0.01">

        <div style="background: #ffebee; padding: 10px; border-radius: 5px; border: 1px solid #ffcdd2; margin-top: 15px;">
            <label style="color: #c62828; font-weight: bold; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" name="risk_flag" value="1" style="width: auto; margin: 0;"> Flag for Reputational Risk?
            </label>
        </div>
        <button type="submit" class="btn-green">Log Inquiry</button>
    </form>
</div>

<script>
    $('#countrySelect1').select2();
    $('#countrySelect2').select2();

    document.getElementById('inquiryNature').addEventListener('change', function() {
        var wrapper = document.getElementById('commodityWrapper');
        var input = document.querySelector('input[name="commodity"]');
        if(this.value === 'Trade') {
            wrapper.style.display = 'block';
        } else {
            wrapper.style.display = 'none';
            input.value = ''; 
        }
    });
</script>
{% endblock %}
