{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4caf50; padding-bottom: 10px; margin-bottom: 20px;">
        <h2 style="margin: 0; color: #2e7d32;">Edit Lead: {{ lead.organization_name }}</h2>
        <a href="{{ url_for('lead_detail', id=lead.id) }}" style="color: #666; text-decoration: none; font-weight: bold;">Cancel & Return</a>
    </div>

    <form method="POST" action="{{ url_for('edit_lead', id=lead.id) }}">
        
        <h3 style="color: #2e7d32; margin-top: 0;">Ownership & Class</h3>
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Sector</label>
                <select id="sectorInput" name="sector" required>
                    {% for item in dropdowns.sectors %}<option value="{{ item }}" {% if lead.sector == item %}selected{% endif %}>{{ item }}</option>{% endfor %}
                </select>
            </div>
            <div style="flex: 1; {% if lead.assigned_business_unit != 'Trade' %}display: none;{% endif %}" id="leadCommodityWrapper">
                <label>Commodity (If Trade)</label>
                <input type="text" id="commodityInput" name="commodity" value="{{ lead.commodity or '' }}">
            </div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Lead Owner</label>
                <input type="text" name="lead_owner" value="{{ lead.lead_owner }}" required>
            </div>
            <div style="flex: 1;">
                <label>Business Unit</label>
                <select name="business_unit" id="buSelect" required>
                    {% for item in dropdowns.business_units %}<option value="{{ item }}" {% if lead.assigned_business_unit == item %}selected{% endif %}>{{ item }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <div style="{% if lead.assigned_business_unit != 'Portfolio Events' %}display: none;{% endif %} background: var(--beige-soft); padding: 15px; border-left: 4px solid var(--maroon); margin-top: 15px; border-radius: 8px;" id="eventWrapper">
            <label style="color: var(--maroon); margin-top: 0;">Event / Campaign Name</label>
            <input type="text" id="eventNameInput" name="event_name" value="{{ lead.event_name or '' }}">
        </div>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Lead Type</label>
                <select name="lead_type" required>
                    {% for item in dropdowns.lead_types %}<option value="{{ item }}" {% if lead.lead_type == item %}selected{% endif %}>{{ item }}</option>{% endfor %}
                </select>
            </div>
            <div style="flex: 1;">
                <label>Executive Sponsor</label>
                <select name="executive_sponsor" required>
                    {% for item in dropdowns.executives %}<option value="{{ item }}" {% if lead.executive_sponsor == item %}selected{% endif %}>{{ item }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <label>Market Focus (Country)</label>
        <select name="country" id="countrySelectEdit" required>
            <option value="{{ lead.country }}" selected>{{ lead.country }}</option>
            {% include 'countries.html' %}
        </select>

        <div style="display: flex; gap: 15px; margin-bottom: 15px; margin-top: 25px;">
            <div style="flex: 1;">
                <label>Priority</label>
                <select name="priority" required><option value="High" {% if lead.priority == 'High' %}selected{% endif %}>High</option><option value="Medium" {% if lead.priority == 'Medium' %}selected{% endif %}>Medium</option><option value="Low" {% if lead.priority == 'Low' %}selected{% endif %}>Low</option></select>
            </div>
            <div style="flex: 1;">
                <label>Risk Level</label>
                <select name="risk_level" required><option value="Low" {% if lead.initial_risk_level == 'Low' %}selected{% endif %}>Low</option><option value="Medium" {% if lead.initial_risk_level == 'Medium' %}selected{% endif %}>Medium</option><option value="High" {% if lead.initial_risk_level == 'High' %}selected{% endif %}>High</option></select>
            </div>
        </div>

        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px;">Scoring Matrix</h3>
        <div style="background: #fafafa; padding: 15px; border-radius: 6px; border: 1px solid #eee;">
            <div style="display: flex; gap: 15px; margin-bottom: 10px;">
                <div style="flex: 1;"><label>Financial</label><input type="number" min="1" max="5" name="score_financial" value="{{ lead.score_financial }}" required></div>
                <div style="flex: 1;"><label>Strategic</label><input type="number" min="1" max="5" name="score_strategic" value="{{ lead.score_strategic }}" required></div>
                <div style="flex: 1;"><label>Urgency</label><input type="number" min="1" max="5" name="score_urgency" value="{{ lead.score_urgency }}" required></div>
            </div>
            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;"><label>Relationship</label><input type="number" min="1" max="5" name="score_relationship" value="{{ lead.score_relationship }}" required></div>
                <div style="flex: 1;"><label>Geographic Fit</label><input type="number" min="1" max="5" name="score_geographic" value="{{ lead.score_geographic }}" required></div>
            </div>
        </div>

        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px;">BANT Qualification</h3>
        <div style="display: flex; gap: 20px; margin-bottom: 15px;">
            <label style="display: flex; align-items: center; gap: 5px; margin-top: 0;"><input type="checkbox" name="budget_confirmed" value="1" {% if lead.budget_confirmed %}checked{% endif %}> Budget Confirmed?</label>
            <label style="display: flex; align-items: center; gap: 5px; margin-top: 0;"><input type="checkbox" name="decision_maker" value="1" {% if lead.decision_maker_identified %}checked{% endif %}> Decision Maker?</label>
            <label style="display: flex; align-items: center; gap: 5px; margin-top: 0;"><input type="checkbox" name="timeline_defined" value="1" {% if lead.timeline_defined %}checked{% endif %}> Timeline Defined?</label>
        </div>

        <label>Estimated Value (USD)</label>
        <input type="number" name="estimated_value" value="{{ lead.estimated_value }}" step="0.01">

        <div style="display: flex; gap: 15px; margin-top: 10px;">
            <div style="flex: 1;"><label>Last Contact Date</label><input type="date" name="last_contact_date" value="{{ (lead.last_contact_date|string)[:10] if lead.last_contact_date else '' }}"></div>
            <div style="flex: 1;"><label>Next Action Date</label><input type="date" name="next_action_date" value="{{ (lead.next_action_date|string)[:10] if lead.next_action_date else '' }}"></div>
        </div>
        
        <button type="submit" class="btn-green">💾 Save All Changes</button>
    </form>
</div>

<script>
$(document).ready(function() {
    $('#countrySelectEdit').select2();

    // Prevent Enter Key Submit
    $('form').on('keypress', function(e) {
        if (e.keyCode === 13 && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            return false;
        }
    });

    // Dynamic Business Unit Logic
    $('#buSelect').on('change', function() {
        var val = $(this).val();
        if (val === 'Portfolio Events') { $('#eventWrapper').show(); } else { $('#eventWrapper').hide(); $('#eventNameInput').val(''); }
        if (val === 'Trade') { $('#leadCommodityWrapper').show(); } else { $('#leadCommodityWrapper').hide(); $('#commodityInput').val(''); }
    });
});
</script>
{% endblock %}
