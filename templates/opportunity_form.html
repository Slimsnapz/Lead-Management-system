{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 800px; margin: 0 auto;">
    <h2>Launch Opportunity</h2>
    <p style="color: #666; margin-bottom: 20px;">Convert a qualified lead into an active pipeline opportunity.</p>

    <form method="POST" action="{{ url_for('opportunity') }}">
        
        <label>Select Qualified Lead</label>
        <select id="leadSelect" name="lead_id" required style="background: #e8f5e9; border: 1px solid #4caf50; width: 100%; padding: 10px; font-weight: bold; color: #2e7d32;">
            <option value="">-- Select a Qualified Lead --</option>
            {% for l in qualified_leads %}
            <option value="{{ l.id }}" data-sector="{{ l.sector }}" data-commodity="{{ l.commodity }}" data-org="{{ l.org }}" data-contact="{{ l.contact }}" {% if prefill_id == l.id|string %}selected{% endif %}>
                {{ l.code }} | {{ l.org }}
            </option>
            {% endfor %}
        </select>

        <div style="display: flex; gap: 15px; margin-top: 15px; margin-bottom: 25px; padding: 15px; background: #f5f5f5; border-radius: 6px; border-left: 4px solid #9e9e9e;">
            <div style="flex: 1;">
                <label style="margin-top: 0; color: #666; font-size: 12px;">Organization</label>
                <input type="text" id="displayOrg" readonly style="background: transparent; border: none; padding: 0; font-weight: bold; color: #333; font-size: 16px;">
            </div>
            <div style="flex: 1;">
                <label style="margin-top: 0; color: #666; font-size: 12px;">Primary Contact</label>
                <input type="text" id="displayContact" readonly style="background: transparent; border: none; padding: 0; font-weight: bold; color: #333; font-size: 16px;">
            </div>
        </div>

        <label>Opportunity Name</label>
        <input type="text" name="opportunity_name" placeholder="e.g., ND Cocoa Export Q3" required>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Target Country / Market</label>
                <select name="country" id="countrySelect4" style="width: 100%;" required>
                    <option value="" disabled selected>-- Select Destination --</option>
                    {% include 'countries.html' %}
                </select>
            </div>
            <div style="flex: 1;">
                <label>Sector</label>
                <select id="oppSector" name="sector" required>
                    <option value="" disabled selected>-- Select Sector --</option>
                    {% for item in dropdowns.sectors %}<option value="{{ item }}">{{ item }}</option>{% endfor %}
                </select>
            </div>
        </div>

        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px;">Deal Structure</h3>
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Opportunity Type</label>
                <select name="type" id="oppTypeSelect" required>
                    <option value="" disabled selected>-- Select Deal Type --</option>
                    {% for item in dropdowns.nature_of_inquiries %}<option value="{{ item }}">{{ item }}</option>{% endfor %}
                </select>
            </div>
            
            <div style="flex: 1; display: none;" id="oppCommodityWrapper">
                <label>Commodity</label>
                <input type="text" id="oppCommodity" name="commodity">
            </div>
            <div style="flex: 1; display: none;" id="oppEventWrapper">
                <label>Event / Campaign Name</label>
                <input type="text" id="oppEventName" name="event_name">
            </div>

            <div style="flex: 1;">
                <label>Revenue Model</label>
                <select name="revenue_model" required>
                    <option value="Commission">Commission</option><option value="Retainer">Retainer</option><option value="Success Fee">Success Fee</option>
                </select>
            </div>
        </div>

        <div id="tradeExecutionWrapper" style="display: none; background: #e8f5e9; padding: 20px; border-left: 4px solid #4caf50; margin-top: 20px; border-radius: 6px;">
            <h3 style="margin-top: 0; color: #2e7d32; border-bottom: 1px solid #c8e6c9; padding-bottom: 5px;">🚢 Trade Logistics & Suppliers</h3>
            
            <div style="display: flex; gap: 15px; margin-bottom: 10px;">
                <div style="flex: 1;"><label>Supplier Org Name</label><input type="text" name="supplier_name"></div>
                <div style="flex: 1;"><label>Supplier Contact Person</label><input type="text" name="supplier_contact"></div>
            </div>

            <div style="display: flex; gap: 15px; margin-bottom: 10px;">
                <div style="flex: 1;"><label>Supplier Email</label><input type="email" name="supplier_email"></div>
                <div style="flex: 1;"><label>Supplier Phone</label><input type="text" name="supplier_phone"></div>
            </div>

            <div style="display: flex; gap: 15px; margin-bottom: 10px;">
                <div style="flex: 1;">
                    <label>Origin Country</label>
                    <select name="trade_origin" id="tradeOriginSelect" style="width: 100%;">
                        <option value="" disabled selected>-- Select Origin --</option>
                        {% include 'countries.html' %}
                    </select>
                </div>
                <div style="flex: 1;"><label>Volume</label><input type="text" name="trade_volume" placeholder="e.g. 500 MT"></div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Execution Stage</label>
                    <select name="trade_stage">
                        <option value="" disabled selected>-- Select Phase --</option>
                        {% for item in dropdowns.trade_stages %}<option value="{{ item }}">{{ item }}</option>{% endfor %}
                    </select>
                </div>
                <div style="flex: 1;"><label>ETD (Departure)</label><input type="date" name="etd"></div>
                <div style="flex: 1;"><label>ETA (Arrival)</label><input type="date" name="eta"></div>
            </div>
        </div>

        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px;">Financial Forecast</h3>
        <label>Estimated Deal Value (Total Transaction Size)</label>
        <input type="number" name="deal_value" step="0.01" placeholder="0.00" required>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;"><label>Projected Revenue</label><input type="number" name="revenue" step="0.01" required></div>
            <div style="flex: 1;"><label>Estimated Delivery Cost</label><input type="number" name="cost" step="0.01" required></div>
        </div>

        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px;">Pipeline Status</h3>
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label>Initial Stage</label>
                <select name="stage" required>
                    <option value="" disabled selected>-- Select Stage --</option>
                    {% for item in dropdowns.pipeline_stages %}<option value="{{ item }}">{{ item }}</option>{% endfor %}
                </select>
            </div>
            <div style="flex: 1;">
                <label>Probability (%)</label>
                <select name="probability" required>
                    <option value="10">10%</option><option value="30">30%</option><option value="50">50%</option><option value="70">70%</option><option value="90">90%</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label>Expected Close Date</label>
                <input type="date" name="close_date" required>
            </div>
        </div>

        <h3 style="border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px;">Execution & Risk</h3>
        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;"><label>Primary Owner</label><input type="text" name="owner" value="{{ session.get('name') }}" required></div>
            <div style="flex: 1;"><label>Supporting Teams</label><input type="text" name="support"></div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 2;"><label>Immediate Next Action</label><input type="text" name="next_action" required></div>
            <div style="flex: 1;"><label>Next Action Date</label><input type="date" name="next_action_date" required></div>
        </div>

        <label>Risk Summary</label>
        <textarea name="risk_summary" rows="3"></textarea>

        <button type="submit" class="btn-green" style="width: 100%; font-size: 16px;">Launch Opportunity</button>
    </form>
</div>

<script>
    $(document).ready(function() {
        // Initialize ALL searchable dropdowns!
        $('#countrySelect4').select2();
        $('#tradeOriginSelect').select2();
        $('#leadSelect').select2();

        // Prevent Enter Key Submit
        $('form').on('keypress', function(e) {
            if (e.keyCode === 13 && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); return false; }
        });

        // Dynamic Form Toggles for Deal Type
        function toggleFields() {
            var val = document.getElementById("oppTypeSelect").value;
            document.getElementById("oppCommodityWrapper").style.display = (val === "Trade") ? "block" : "none";
            document.getElementById("oppEventWrapper").style.display = (val === "Event") ? "block" : "none";
            document.getElementById("tradeExecutionWrapper").style.display = (val === "Trade") ? "block" : "none";
        }
        document.getElementById("oppTypeSelect").addEventListener("change", toggleFields);
        toggleFields();

        // Auto-fill Lead Data
        function populateLeadData() {
            var selected = document.getElementById('leadSelect').options[document.getElementById('leadSelect').selectedIndex];
            if (selected && selected.value !== "") {
                document.getElementById('oppSector').value = selected.getAttribute('data-sector') || '';
                document.getElementById('oppCommodity').value = selected.getAttribute('data-commodity') || '';
                document.getElementById('displayOrg').value = selected.getAttribute('data-org') || 'N/A';
                document.getElementById('displayContact').value = selected.getAttribute('data-contact') || 'N/A';
            } else {
                document.getElementById('displayOrg').value = '';
                document.getElementById('displayContact').value = '';
            }
        }
        $('#leadSelect').on('select2:select', populateLeadData);
        populateLeadData();
    });
</script>
{% endblock %}
